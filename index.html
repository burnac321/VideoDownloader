<!DOCTYPE html>
<html>
<head>
    <title>Personal Video Downloader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🔗 Personal Video Downloader</h1>
        <p>Paste YouTube/Facebook/your video URLs to extract direct download links</p>
        
        <div class="input-group">
            <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." />
            <button onclick="extractVideoLinks()">Extract Links</button>
        </div>
        
        <div id="result"></div>
        <div id="progress" style="display: none;">Processing... ⏳</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
